name: Backend CI

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "src/**"

permissions:
  contents: read

jobs:
  build-and-test:
    if: >-
      github.base_ref == 'dev' ||
      (github.base_ref == 'main' && github.head_ref == 'dev')
    name: Test and build for ${{ github.base_ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: capstone
      DB_USERNAME: root
      DB_PASSWORD: capstone_root_password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    services:
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: capstone_root_password
          MYSQL_DATABASE: capstone
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK 21 and Maven cache
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Test and build
        run: mvn --batch-mode clean verify
