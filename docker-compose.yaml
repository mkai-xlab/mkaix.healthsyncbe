name: knee-oa-be

services:
  mysql:
    # MySQL is optional on VPS deployments. Enable it locally with:
    # docker compose --profile database up -d mysql
    profiles:
      - database
    image: dhi.io/mysql:9
    container_name: knee-oa-mysql
    restart: unless-stopped
    env_file:
      - ../env/database.env
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - knee-oa-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  maildev:
    image: maildev/maildev:2.1.0
    container_name: knee-oa-maildev
    restart: unless-stopped
    ports:
      - "1080:1080" # Web UI
      - "1025:1025" # SMTP Port
    networks:
      - knee-oa-net

  redis:
    image: dhi.io/redis:8-alpine
    container_name: knee-oa-redis
    restart: unless-stopped
    # env_file:
    #   - ../env/redis.env
    ports:
      - "6379:6379"
    command: redis-server --protected-mode no
    networks:
      - knee-oa-net

  be:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knee-oa-be
    restart: unless-stopped
    ports:
      - "8000:8080"
    env_file:
      - ../env/be.env
    environment:
      APP_AVATAR_STORAGE_DIR: /app/data/avatars
      APP_PDF_EXPORT_DIR: /app/data/reports
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - knee-oa-net
    volumes:
      - ./data:/app/data

volumes:
  mysql_data:

networks:
  knee-oa-net:
    name: knee-oa-net
