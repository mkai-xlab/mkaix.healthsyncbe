services:
  mysql:
    # MySQL is optional on VPS deployments. Enable it locally with:
    # docker compose --profile database up -d mysql
    profiles:
      - database
    image: dhi.io/mysql:9
    container_name: knee-oa-mysql
    restart: unless-stopped
    env_file:
      - ../env/database.env
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - knee-oa-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  maildev:
    image: maildev/maildev:2.1.0
    container_name: knee-oa-maildev
    restart: unless-stopped
    ports:
      - "1080:1080" # Web UI
      - "1025:1025" # SMTP Port
    networks:
      - knee-oa-net

  redis:
    image: dhi.io/redis:8-alpine
    container_name: knee-oa-redis
    restart: unless-stopped
    # env_file:
    #   - ../env/redis.env
    ports:
      - "6379:6379"
    command: redis-server --protected-mode no
    networks:
      - knee-oa-net

  qdrant:
    profiles:
      - rag
    image: qdrant/qdrant:v1.15.4
    container_name: knee-oa-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - knee-oa-net

  ollama:
    profiles:
      - rag
    image: ollama/ollama:0.11.10
    container_name: knee-oa-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - knee-oa-net

  be:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knee-oa-be
    restart: unless-stopped
    ports:
      - "8000:8080"
    env_file:
      - ../env/be.env
    environment:
      APP_AVATAR_STORAGE_DIR: /app/data/avatars
      APP_PDF_EXPORT_DIR: /app/data/reports
      CHAT_KNOWLEDGE_DIR: /app/data/knowledge
      CHAT_AI_ENABLED: ${CHAT_AI_ENABLED:-false}
      CHAT_MODEL_PROVIDER: ${CHAT_MODEL_PROVIDER:-none}
      CHAT_EMBEDDING_PROVIDER: ${CHAT_EMBEDDING_PROVIDER:-none}
      CHAT_VECTOR_STORE: ${CHAT_VECTOR_STORE:-none}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_GRPC_PORT: ${QDRANT_GRPC_PORT:-6334}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - knee-oa-net
    volumes:
      - ./data:/app/data

volumes:
  mysql_data:
  qdrant_data:
  ollama_data:

networks:
  knee-oa-net:
    external: true
    name: knee-oa-net
