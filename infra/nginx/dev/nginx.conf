    # ----------------------------------------------------------------------
    # Future DNS virtual hosts
    # ----------------------------------------------------------------------
    # Uncomment each complete server block only after its DNS A/AAAA record
    # points to this EC2 instance. Replace my-domain.com with the real domain.

    # Flutter UI: https://www.my-domain.com
    # When enabling this block, remove default_server from the active site above
    # or remove the active site entirely to avoid serving the UI twice.

    # development
    server {
        listen 3000;
        listen [::]:3000;
        # server_name my-domain.com www.my-domain.com;
    
        root /home/ubuntu/healthsync/mkaix.healthsyncfe/build/web;
        index index.html;
    
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

