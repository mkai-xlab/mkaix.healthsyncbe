# Redis is not HTTP, so redis.my-domain.com cannot use an HTTP server block.
# Keep Redis private and let applications connect through the Docker network or
# localhost. If remote Redis access is ever required, use a VPN or SSH tunnel;
# do not expose port 6379 directly to the public internet.
