user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/wasm
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # WebSocket-aware Connection header used by all HTTP upstreams below.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Active site: Flutter web application.
    # This default server works with the EC2 public IP before DNS is configured.
    # server {
    #     listen 80 default_server;
    #     listen [::]:80 default_server;

    #     # Replace the catch-all name after DNS is configured, for example:
